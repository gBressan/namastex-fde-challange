services:
  # Serviço original do desafio, mantido idêntico.
  quote-api:
    build: ./quote-service
    ports:
      - "8000:8000"
    environment:
      # instabilidade simulada (de proposito) -- ajuste se quiser durante o dev
      QUOTE_FAILURE_RATE: "0.20"
      QUOTE_SLOW_RATE: "0.10"
      QUOTE_SLOW_SECONDS: "8"
      # QUOTE_SEED: "42"   # descomente p/ falhas reproduziveis
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: autoseguro
      POSTGRES_PASSWORD: autoseguro
      POSTGRES_DB: autoseguro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoseguro -d autoseguro"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Aplica as migrações e termina. Os outros serviços do agente esperam por ele.
  migrate:
    build: ./agent
    command: ["autoseguro", "db", "migrate"]
    environment:
      DATABASE_URL: postgresql://autoseguro:autoseguro@postgres:5432/autoseguro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # LLM local (Qwen via Ollama), com API compatível com a da OpenAI em :11434/v1.
  # Para usar a GPU NVIDIA: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
  ollama:
    image: ollama/ollama:0.40.5
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      # Mantém o modelo carregado entre as mensagens (o padrão descarrega após 5 min).
      OLLAMA_KEEP_ALIVE: "30m"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Baixa o modelo uma vez (fica no volume `ollama`) e termina.
  ollama-pull:
    image: ollama/ollama:0.40.5
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen3.5:4b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # Agente pela linha de comando: docker compose run --rm agent autoseguro <comando>
  agent:
    build: ./agent
    profiles: ["cli"]
    env_file:
      - path: .env
        required: false
    environment:
      QUOTE_API_URL: http://quote-api:8000
      DATABASE_URL: postgresql://autoseguro:autoseguro@postgres:5432/autoseguro
      OLLAMA_BASE_URL: http://ollama:11434/v1
    depends_on:
      migrate:
        condition: service_completed_successfully
      quote-api:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    command: ["autoseguro", "doctor"]

volumes:
  pgdata:
  ollama:
