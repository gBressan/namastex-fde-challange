[project]
name = "autoseguro"
version = "0.1.0"
description = "Agente de cotação de seguro auto da AutoSeguro (desafio FDE Namastex)"
readme = "README.md"
authors = [{ name = "Gabriel da Veiga Bressan" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "numpy>=2.5.4",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.6",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
autoseguro = "autoseguro.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N"]

[tool.ruff.lint.per-file-ignores]
"src/autoseguro/migrations/versions/*.py" = ["N999"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = ["src", "."]

[[tool.mypy.overrides]]
module = ["tests.*"]
# Asserts seguidos sobre o mesmo atributo (ex.: estado do breaker) confundem o narrowing.
disable_error_code = ["comparison-overlap"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: precisa de um Postgres acessível em DATABASE_URL",
    "chaos: roda contra o container da quote-api com caos ligado",
    "data: lê o dataset real em dataset/",
    "api: precisa da quote-api rodando em QUOTE_API_URL",
]
